<!doctype html>
<html><head><meta charset="utf-8"><title>App icon</title></head>
<body style="margin:0;background:#0b0f15;color:#c2c8d0;font:14px system-ui">
<canvas id="out" width="1024" height="1024" style="display:block"></canvas>
<p style="margin:12px"><a id="save" download="icon-master.png" style="color:#e3ae28">Save icon-master.png</a>
  and put it at assets/icon-master.png, then run scripts/make_icon.py.</p>
<script>
// The master of the app icon: a gunmetal map pin with a gold lip, on white feathered wings, on a
// dark plate with a bronze rim. The pin is ray-marched in WebGL; the wings are painted feather by
// feather in 2D. Everything is drawn at 2048 px and brought down to 1024 for anti-aliasing.
// Open this file in Chrome. Nothing here is random at run time, so a render is repeatable.
const S = 2048, K = S / 256;           // the layout is authored on a 256 grid
const TILT = 0.1;                      // a look from slightly above shows the pin's thickness
const METAL = { main: [.3, .32, .36], high: [.6, .63, .68], deep: [.12, .13, .15], lip: [1, .78, .4], rough: .18 };
function mk(w, h = w) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const lerp = (a, b, t) => a + (b - a) * t;

// ------------------------------------------------------------------ the pin, ray-marched
const PIN_FS = `#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uRotX; uniform float uRough; uniform vec3 uMain, uHigh, uDeep, uLip;
out vec4 o;
// On the 256 grid the head is centred at (128, 114) with radius 44, which is one unit here.
float sdUnevenCapsule(vec2 p, float r1, float r2, float h) {
  p.x = abs(p.x);
  float b = (r1 - r2) / h, a = sqrt(1.0 - b * b), k = dot(p, vec2(-b, a));
  if (k < 0.0) return length(p) - r1;
  if (k > a * h) return length(p - vec2(0.0, h)) - r2;
  return dot(p, vec2(a, b)) - r1;
}
float smin(float a, float b, float k) { float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0); return mix(b, a, h) - k * h * (1.0 - h); }
float smax(float a, float b, float k) { return -smin(-a, -b, k); }
float sdTorus(vec3 p, vec2 t) { vec2 q = vec2(length(p.xy) - t.x, p.z); return length(q) - t.y; }
float slab(vec3 p, float d2, float th) { vec2 w = vec2(d2, abs(p.z) - th); return min(max(w.x, w.y), 0.0) + length(max(w, 0.0)); }
float dLip(vec3 p) { return sdTorus(p - vec3(0.0, 0.0, 0.335), vec2(0.705, 0.068)); }
// A lens-shaped body, fuller in the middle, with a raised lip round a concave dish.
float map(vec3 p) {
  float d2 = sdUnevenCapsule(vec2(p.x, -p.y), 1.0, 0.07, 2.28);
  float th = 0.36 * sqrt(clamp(-d2 / 0.85, 0.0, 1.0)) + 0.05;
  float d = slab(p, d2, th) * 0.8;
  d = smin(d, dLip(p), 0.06);
  float cyl = length(p.xy) - 0.6;
  float dish = length(p - vec3(0.0, 0.0, 1.2)) - 1.12;
  return smax(d, -max(cyl, dish), 0.035);
}
vec3 nrm(vec3 p) { vec2 e = vec2(0.0015, 0.0); return normalize(vec3(map(p + e.xyy) - map(p - e.xyy), map(p + e.yxy) - map(p - e.yxy), map(p + e.yyx) - map(p - e.yyx))); }
float ao(vec3 p, vec3 n) { float o = 0.0, s = 1.0; for (int i = 1; i <= 6; i++) { float h = 0.03 * float(i); o += (h - map(p + n * h)) * s; s *= 0.7; } return clamp(1.0 - 2.2 * o, 0.0, 1.0); }
float box(vec3 r, vec3 dir, float size, float soft) { soft += uRough * 0.6; return smoothstep(cos(size + soft), cos(size), dot(r, normalize(dir))) * (1.0 - 0.45 * uRough); }
// A studio: a key softbox top left, a rim strip right, a soft fill in front, a warm bounce below.
vec3 env(vec3 r) {
  vec3 c = mix(vec3(0.018, 0.014, 0.012), vec3(0.06, 0.05, 0.045), clamp(r.y * 0.5 + 0.5, 0.0, 1.0));
  c += vec3(1.0, 0.95, 0.88) * 3.2 * box(r, vec3(-0.55, 0.75, 0.55), 0.32, 0.22);
  c += vec3(1.0, 0.9, 0.8) * 1.3 * box(r, vec3(0.8, 0.25, 0.25), 0.12, 0.12);
  c += vec3(0.9, 0.95, 1.0) * 0.6 * box(r, vec3(0.0, 0.1, 1.0), 0.45, 0.4);
  c += vec3(0.5, 0.32, 0.16) * 0.35 * box(r, vec3(0.0, -1.0, 0.3), 0.8, 0.5);

}
vec3 aces(vec3 x) { return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }
vec4 shade(vec2 frag) {
  vec2 px = frag / uRes * 256.0; px.y = 256.0 - px.y;
  vec2 q = vec2((px.x - 128.0) / 44.0, -(px.y - 114.0) / 44.0);
  vec3 ro = vec3(q, 6.0), rd = vec3(0.0, 0.0, -1.0);

  ro.y -= 0.55 * sx;

  base = mix(base, uDeep, clamp(0.6 * (1.0 - occ) + 0.55 * inRecess + 0.4 * smoothstep(-0.4, -2.3, p.y), 0.0, 1.0));
  base = mix(base, uLip, 1.0 - smoothstep(0.0, 0.05, dLip(p) - 0.005));

  vec3 col = env(r) * F * mix(0.3, 1.0, occ);
  vec3 L = normalize(vec3(-0.55, 0.75, 0.55));
  col += base * 0.1 * clamp(dot(n, L), 0.0, 1.0) * occ;
  col += vec3(1.0, 0.94, 0.85) * pow(clamp(dot(r, L), 0.0, 1.0), spec) * specI * occ;
  // the dish reflects the pin itself far more than the studio, so it sits darker
  col *= mix(1.0, 0.45, inRecess * (1.0 - smoothstep(0.3, 0.58, length(p.xy))));
  col = aces(col * 1.1);
  return vec4(pow(col, vec3(1.0 / 2.2)), 1.0);
}

  vec4 acc = vec4(0.0);
  for (int j = 0; j < 2; j++) for (int i = 0; i < 2; i++) acc += shade(gl_FragCoord.xy + (vec2(i, j) - 0.5) * 0.5);
  acc /= 4.0;
  o = vec4(acc.rgb * acc.a, acc.a);
}`;
function renderPin() {
  const c = mk(S), gl = c.getContext('webgl2', { premultipliedAlpha: true, alpha: true, preserveDrawingBuffer: true });
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  const pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, `#version 300 es
  in vec2 a; void main(){ gl_Position = vec4(a, 0.0, 1.0); }`));
  gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, PIN_FS)); gl.linkProgram(pr); gl.useProgram(pr);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr, 'a'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  gl.uniform2f(gl.getUniformLocation(pr, 'uRes'), S, S);
  gl.uniform1f(gl.getUniformLocation(pr, 'uRotX'), TILT);
  gl.uniform1f(gl.getUniformLocation(pr, 'uRough'), METAL.rough);
  for (const k of ['Main', 'High', 'Deep', 'Lip']) gl.uniform3fv(gl.getUniformLocation(pr, 'u' + k), METAL[k.toLowerCase()]);
  gl.viewport(0, 0, S, S); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); gl.finish();

}

// ------------------------------------------------------------------ wings, painted feather by feather
const JIT = Array.from({ length: 400 }, (_, k) => ((k * 7919) % 97) / 97 - 0.5);
function featherGeom(bx, by, ang, len, width, bend, mirror) {
  const a = ang * Math.PI / 180, dx = Math.cos(a), dy = Math.sin(a), nx = -dy, ny = dx;
  const steps = 40, C = [], Lf = [], Rt = [];
  for (let k = 0; k <= steps; k++) {
    const s = k / steps;
    let cx = bx + dx * s * len + nx * bend * len * s * s, cy = by + dy * s * len + ny * bend * len * s * s;
    const hw = width * Math.pow(Math.sin(Math.PI * Math.min(s, .999)), .5) * (1 - .3 * s);
    let lx = cx + nx * hw * .72, ly = cy + ny * hw * .72, rx = cx - nx * hw, ry = cy - ny * hw;
    if (mirror) { cx = 256 - cx; lx = 256 - lx; rx = 256 - rx; }

function featherPath(g, F) {
  g.beginPath(); g.moveTo(...F.Lf[0]);
  for (let i = 1; i < F.Lf.length; i++) g.lineTo(...F.Lf[i]);
  for (let i = F.Rt.length - 1; i >= 0; i--) g.lineTo(...F.Rt[i]);
  g.closePath();
}
function mixHex(c1, c2, t) { const a = [1, 3, 5].map(i => parseInt(c1.slice(i, i + 2), 16)), b = [1, 3, 5].map(i => parseInt(c2.slice(i, i + 2), 16)); return `rgb(${a.map((x, i) => Math.round(x + (b[i] - x) * t)).join(',')})`; }
function paintFeather(g, F, tone, opts) {

  g.save(); g.filter = `blur(${opts.shadowBlur || 5}px)`; g.translate(opts.mirror ? -5 : 5, 9); featherPath(g, F); g.fillStyle = `rgba(3,6,10,${opts.shadow ?? .45})`; g.fill(); g.restore();

  gr.addColorStop(0, mixHex('#6d7f91', '#b4c3cf', 1 - tone)); gr.addColorStop(.35, mixHex('#c3d0db', '#edf2f6', 1 - tone)); gr.addColorStop(.8, '#f8fbfd'); gr.addColorStop(1, '#ffffff');

  g.save(); featherPath(g, F); g.clip();

  for (let k = 0; k < n; k++) {
    const s = .03 + .95 * k / n, i = Math.min(F.steps - 1, Math.floor(s * F.steps)), f = s * F.steps - i;
    const c = [lerp(F.C[i][0], F.C[i + 1][0], f), lerp(F.C[i][1], F.C[i + 1][1], f)];
    const j = Math.min(F.steps, i + 3);

      const e = E[j], w = r();
      g.beginPath(); g.moveTo(c[0], c[1]);
      g.quadraticCurveTo(lerp(c[0], e[0], .5) + (r() - .5) * 3, lerp(c[1], e[1], .5) + (r() - .5) * 3, e[0] + (r() - .5) * 5, e[1] + (r() - .5) * 5);
      g.strokeStyle = w < .55 ? `rgba(255,255,255,${.16 + r() * .2})` : `rgba(${dark ? '52,66,82' : '90,105,120'},${.1 + r() * .16})`;

  const m = Math.floor(F.steps / 2), vg = g.createLinearGradient(...F.Lf[m], ...F.Rt[m]);
  vg.addColorStop(0, 'rgba(255,255,255,.3)'); vg.addColorStop(.45, 'rgba(255,255,255,0)'); vg.addColorStop(1, 'rgba(46,60,76,.4)');
  featherPath(g, F); g.fillStyle = vg; g.fill();
  if (opts.split) { const k0 = Math.floor(F.steps * (.55 + r() * .2)); const e = F.Rt[k0], c = F.C[k0 - 2]; g.beginPath(); g.moveTo(...e); g.lineTo(lerp(e[0], c[0], .6), lerp(e[1], c[1], .6)); g.strokeStyle = 'rgba(20,28,38,.55)'; g.lineWidth = 3; g.stroke(); }
  g.restore();
  if (opts.shaft) {
    g.beginPath(); g.moveTo(...F.C[0]); for (let i = 1; i < F.C.length * .88; i++) g.lineTo(...F.C[i]);
    const sg = g.createLinearGradient(...F.C[0], ...tip); sg.addColorStop(0, 'rgba(120,135,150,.8)'); sg.addColorStop(1, 'rgba(230,238,245,.5)');
    g.strokeStyle = sg; g.lineWidth = 2.6; g.lineCap = 'round'; g.stroke();
    g.beginPath(); g.moveTo(F.C[0][0] - 1.5, F.C[0][1]); for (let i = 1; i < F.C.length * .8; i++) g.lineTo(F.C[i][0] - 1.5, F.C[i][1]);
    g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 1; g.stroke();

}
// Rows from the back: primaries, secondaries, greater coverts, then lesser coverts and the down
// along the leading edge. A raised wing, as in the game's art: shoulder high, tips pointing down.
function rows() {
  const j = { i: 0, n() { return JIT[this.i++ % JIT.length]; } };
  const R = [];
  let row = [];
  for (let i = 0, n = 11; i < n; i++) { const t = i / (n - 1); row.push({ g: [lerp(222, 180, t), lerp(62, 112, t), lerp(97, 116, t) + j.n() * 3, lerp(146, 96, t) * (1 + j.n() * .05), lerp(12, 10.5, t), lerp(.05, .02, t)], tone: lerp(.05, .45, t), shaft: true, split: i % 3 === 1 }); }
  R.push(row); row = [];
  for (let i = 0, n = 10; i < n; i++) { const t = i / (n - 1); row.push({ g: [lerp(204, 156, t), lerp(66, 114, t), lerp(104, 124, t) + j.n() * 3, lerp(100, 66, t) * (1 + j.n() * .05), lerp(11.5, 10, t), .04], tone: lerp(.3, .65, t), shaft: true, split: i % 4 === 2 }); }
  R.push(row); row = [];
  for (let i = 0, n = 16; i < n; i++) { const t = i / (n - 1); row.push({ g: [lerp(222, 154, t) + j.n() * 3, lerp(58, 102, t) + j.n() * 3, lerp(98, 122, t) + j.n() * 8, lerp(62, 42, t) * (1 + j.n() * .16), lerp(11.5, 10, t), .06], tone: lerp(0, .4, t) + j.n() * .15, shaft: i % 2 === 0 }); }
  R.push(row);
  for (const [ri, [n, lo, hi, w, tone0]] of [[20, 28, 38, 9, .3], [30, 14, 22, 6.5, .2]].entries()) {
    row = [];
    for (let i = 0; i < n; i++) {
      const u = i / (n - 1);
      const x = (1 - u) ** 2 * 150 + 2 * (1 - u) * u * 160 + u * u * 228, y = (1 - u) ** 2 * 100 + 2 * (1 - u) * u * 20 + u * u * 56 + (ri === 0 ? 10 : 0);
      row.push({ g: [x + j.n() * 4, y + j.n() * 4 + (ri === 1 ? 2 : 0), lerp(120, 96, u) + j.n() * 16, lerp(lo, hi, u) * (1 + j.n() * .3), w * (1 + j.n() * .2), .08 + j.n() * .1], tone: lerp(tone0, 0, u) + j.n() * .2, shaft: false });

function renderWings() {

    lg.clearRect(0, 0, S, S);

      const F = featherGeom(...f.g, mirror);
      paintFeather(lg, F, f.tone, { seed: seed++, mirror, shaft: f.shaft, split: f.split, len: f.g[3], shadow: k < 2 ? .5 : .4, shadowBlur: k < 2 ? 6 : 4 });
    }

    wg.drawImage(layer, 0, 0);
  }

  const fr = rng(77);
  for (const m of [false, true]) for (let i = 0; i < 90; i++) {
    const u = fr(), x = (1 - u) ** 2 * 150 + 2 * (1 - u) * u * 160 + u * u * 228, y = (1 - u) ** 2 * 100 + 2 * (1 - u) * u * 20 + u * u * 56;
    const X = (m ? 256 - x : x) * K + (fr() - .5) * 30, Y = y * K + fr() * 40 + 6;

    wg.beginPath(); wg.ellipse(X, Y, 8 + fr() * 14, 5 + fr() * 8, (m ? -1 : 1) * (.4 + fr() * .8), 0, 7);

}

// ------------------------------------------------------------------ plate and composite
function squircle(g, x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function render() {
  const out = mk(S), g = out.getContext('2d');
  const x0 = 8 * K, w = 240 * K, r = 58 * K;

  eng(() => { g.beginPath(); g.arc(128 * K, 128 * K, 92 * K, 0, 7); });
  eng(() => { g.beginPath(); g.moveTo(128 * K, 36 * K); g.lineTo(220 * K, 128 * K); g.lineTo(128 * K, 220 * K); g.lineTo(36 * K, 128 * K); g.closePath(); });
  const hg = g.createRadialGradient(128 * K, 116 * K, 0, 128 * K, 116 * K, 120 * K); hg.addColorStop(0, 'rgba(236,160,64,.5)'); hg.addColorStop(.5, 'rgba(190,105,40,.16)'); hg.addColorStop(1, 'rgba(190,105,40,0)');
  g.globalCompositeOperation = 'screen'; g.fillStyle = hg; g.fillRect(0, 0, S, S); g.globalCompositeOperation = 'source-over';
  const vg = g.createRadialGradient(S / 2, S / 2, S * .3, S / 2, S / 2, S * .62); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.45)'); g.fillStyle = vg; g.fillRect(0, 0, S, S);
